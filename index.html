  const rows=upcoming.map(g=>{
    const stale=!g.sources.some(id=>ParkingData.sourceUsable(DATA,id,Date.now()));
    const x=dt(g.d),tag=stale?`<span class="tag">${T("stale")}</span>`:g.c||(!g.start&&!g.conflict)?"":`<span class="tag">${T(g.conflict?"conflict":"timeTbd")}</span>`;
    return `<div class="row" role="button" tabindex="0" data-d="${g.d}" aria-label="${esc(longDate(g.d))}">
      <div class="dt"><b>${x.getDate()}</b><span>${x.toLocaleDateString(T("loc"),{month:"short"})}</span></div>
      <div class="info"><div class="t">${x.toLocaleDateString(T("loc"),{weekday:"long"})} · ${eventWindow(g)}${tag}</div><div class="w">${name(g)}</div></div>
      ${validCalendar(g)?`<a class="cal" href="${esc(gcal(g))}" target="_blank" rel="noopener noreferrer" aria-label="${T("add")}">${I.cal}</a>`:""}
    </div>`}).join("");
  const timed=upcoming.some(validCalendar);
  return `<h2 id="upc">${T("upc")}</h2><div class="list">${rows||`<div class="row" style="color:var(--mute)">${T(loading?"checking":"none")}</div>`}</div><button class="all" id="ics" type="button" ${timed?"":"disabled"}>${T("all")}</button>${provenance()}`;
}

I.prev='<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';I.nxt='<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";
  $("title").textContent=T("title");$("lang").textContent=T("lang");
  
  const assessment=ParkingData.assess(DATA,sel);
  LAST_STATE=assessment.state+"|"+assessment.reason+"|"+!!assessment.delayed;
  const selected=assessment.events,g=selected[0];
  let sig="--grn",ink="--grn-ink",icon=I.tick,title=T("free"),win="",tiny="",prefix=T("pre");
  if(loading&&!DATA){sig="--amb";ink="--amb-ink";icon=I.clock;title=T("loading");win="";tiny=T("checking");prefix=""}
  else if(assessment.state==="unknown"){
    sig="--mute";ink="--mute";icon=I.clock;title=T("unknown");tiny=T(assessment.reason);prefix="";
  }else if(g){
    const tentative=assessment.state==="tentative";
    title=T(tentative?(selected.every(e=>e.kind!=="sport")?"plannedEvent":"planned"):"block");prefix=tentative?"":T("pre");
    const evening=assessment.windows.length&&+assessment.windows[0][0].slice(0,2)>=16;
    sig=tentative?"--mute":"--red";ink=tentative?"--mute":"--red-ink";icon=tentative?I.clock:I.x;
    win=assessment.windows.length?assessment.windows.map(([a,b])=>T("between").replace("{a}",`<bdi>${a}</bdi>`).replace("{b}",`<bdi>${b}</bdi>`)).join(" · "):T("timeTbd");
    tiny=selected.map(e=>`${e.k?T("game")+e.k+" · ":""}${name(e)}`).join(" + ");
    tiny+=`<br>${T("windowEstimate")}${assessment.reason?" · "+T(assessment.reason==="tentative"?"timeTbd":assessment.reason):""}`;
    if(!tentative)tiny+=`<br>${T(selected.filter(e=>e.c&&!e.conflict).every(e=>e.verification==="cross_checked")?"crossChecked":"official")}`;
  }else{
    win=T("nogame");
    const nx=upcoming.find(x=>x.d>sel);
    if(assessment.reason&&!(assessment.delayed&&assessment.reason==="partial"))tiny=T(assessment.reason);
    if(nx)tiny+=(tiny?"<br>":"")+`${T("next")} <button class="link sm" style="margin:0" data-d="${nx.d}" type="button">${longDate(nx.d)}</button>`;
  }
  if(assessment.delayed)tiny=T("delayed")+(tiny?"<br>"+tiny:"");
  const hint=!hinted;hinted=true;
  const rel=sel===TODAY?T("today")+" · ":sel===TOMORROW?T("tom")+" · ":"";
  const back=sel===TODAY?"":`<button type="button" data-d="${TODAY}">${T("backToday")}</button>`;
  $("app").innerHTML=`<div class="screen${hint?" first":""}" style="--sig:var(${sig});--ink2:var(${ink})">
    <div class="res"><div class="nav">
        <button class="hb" type="button" data-nav="-1" aria-label="${T("prev")}"${sel<=TODAY?" hidden":""}>${I.prev}</button>
        <div class="when"><label class="datepill${hint?" hint":""}">${I.cal}<span>${rel}${dt(sel).toLocaleDateString(T("loc"),{weekday:"short",day:"numeric",month:"short"})}</span>${I.down}<input type="date" id="date" min="${TODAY}" max="${MAX}" value="${sel}" aria-label="${T("other")}"></label>${back}</div>
        <button class="hb" type="button" data-nav="1" aria-label="${T("nxt")}"${sel>=MAX?" hidden":""}>${I.nxt}</button></div>
      <div class="badge">${icon}</div><div class="rt${assessment.state==="unknown"?" unknown":assessment.state==="tentative"?" planned":""}" role="status">${prefix?`<span class="th">${prefix}</span>`:""}<span>${title}</span></div><div class="win">${win}</div><div class="sm">${tiny}</div>
      ${selected.length===1&&validCalendar(g)?`<button class="addc" id="addc" type="button">${I.plus}<span>${T("add")}</span></button>`:""}
    </div>
    <button class="more" id="more" type="button">${T("upc")}${I.down}</button></div>${listHTML()}`;
  const a=$("addc");
  if(a)a.onclick=()=>{window.open(gcal(g),"_blank","noopener");a.classList.add("done");a.innerHTML=I.tick+`<span>${T("added")}</span>`};
  $("more").onclick=()=>$("upc").scrollIntoView({behavior:"smooth",block:"start"});
  $("ics").onclick=exportIcs;
}

let tt;
function toast(msg){const e=$("toast");e.textContent=msg;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2400)}

function exportIcs(){
  const escapeIcs=v=>String(v).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,");
  const utc=v=>new Date(v).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Kibbutz Parking//EN","CALSCALE:GREGORIAN",`X-WR-CALNAME:${escapeIcs(T("calT"))}`];
  upcoming.filter(validCalendar).forEach(g=>{
    L.push("BEGIN:VEVENT",`UID:p-${g.id}@kibbutz-parking`,`DTSTAMP:${utc(Date.now())}`,
      `DTSTART:${utc(g.start)}`,`DTEND:${utc(g.end)}`,
      `SUMMARY:${escapeIcs(T("windowEstimate")+" – "+nameIn(g,lang))}`,`DESCRIPTION:${escapeIcs(calendarDetails(g))}`,"END:VEVENT");
  });
  L.push("END:VCALENDAR");
  // RFC 5545 line folding counts UTF-8 octets, including Hebrew characters.
  const fold=line=>{let result="",size=0;for(const ch of line){const n=new TextEncoder().encode(ch).length;if(size+n>75){result+="\r\n ";size=1}result+=ch;size+=n}return result};
  const a=document.createElement("a"),url=URL.createObjectURL(new Blob([L.map(fold).join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"}));
  a.href=url;a.download="no-parking-bloomfield.ics";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast(T("ics"));
}

$("app").onclick=e=>{
  const c=e.target.closest(".cal");
  if(c){c.classList.add("done");c.innerHTML=I.tick;toast(T("opened"));return}
  const p=e.target.closest("[data-d]");
  const n=e.target.closest("[data-nav]");
  if(n){sel=addDay(sel,+n.dataset.nav);render();return}
  if(p){sel=p.dataset.d;render();window.scrollTo(0,0)}
};
$("app").addEventListener("change",e=>{if(e.target.id==="date"&&e.target.value){sel=e.target.value;render();window.scrollTo(0,0)}});
$("lang").onclick=()=>{lang=lang==="he"?"en":"he";try{localStorage.setItem("lang",lang)}catch(e){}render()};

async function load(){
  const previous=JSON.stringify(DATA),wasLoading=loading;
  try{
    const r=await fetch("games.json?t="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(15000)});
    if(!r.ok)throw Error("Schedule unavailable");
    DATA=ParkingData.validate(await r.json());
    UPDATED=DATA.updated||"";
    try{localStorage.setItem("parking-data-v2",JSON.stringify(DATA))}catch(e){}
  }catch(e){
    if(!DATA){try{DATA=ParkingData.validate(JSON.parse(localStorage.getItem("parking-data-v2")))}catch(e){}}
  }
  // Retired source: also remove it from saved offline snapshots.
  if(DATA){DATA.games=DATA.games.filter(g=>!g.sources.includes("haoman"));DATA.sources=DATA.sources.filter(s=>s.id!=="haoman")}
  loading=false;
  G=DATA?.games||[];upcoming=G.filter(g=>(g.end?ParkingData.dateAt(g.end):g.d)>=TODAY);
  if(wasLoading||previous!==JSON.stringify(DATA)||LAST_STATE!==ParkingData.assess(DATA,sel).state+"|"+ParkingData.assess(DATA,sel).reason+"|"+!!ParkingData.assess(DATA,sel).delayed)render();
}
function updateToday(){
  const day=ParkingData.dateAt(Date.now());
  if(day!==TODAY){const wasToday=sel===TODAY;TODAY=day;TOMORROW=addDay(day,1);MAX=addDay(day,365);if(wasToday)sel=day;upcoming=G.filter(g=>(g.end?ParkingData.dateAt(g.end):g.d)>=TODAY);render()}
}
$("app").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){e.preventDefault();sel=e.target.dataset.d;render();window.scrollTo(0,0)}});
setInterval(()=>{updateToday();if(!document.hidden)load()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateToday();load()}});
window.addEventListener("online",load);
render();load();
</script>
